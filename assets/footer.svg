<svg xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130" shape-rendering="crispEdges">
  <style>
    .cursor { animation: fa 1s steps(1) infinite; }
    
  .legB, .tailB { opacity: 0; }
  .legA { animation: fa .36s steps(1) infinite; }
  .legB { animation: fb .36s steps(1) infinite; }
  .tailA { animation: fa .5s steps(1) infinite; }
  .tailB { animation: fb .5s steps(1) infinite; }
  .tongue { animation: fa .6s steps(1) infinite; }
  .bob { animation: bob .36s steps(1) infinite; }
  .eye { animation: blink 4s steps(1) infinite; }
  @keyframes fa { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes fb { 0% { opacity: 0; } 50% { opacity: 1; } }
  @keyframes bob { 0% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
  @keyframes blink { 0%, 90%, 97%, 100% { opacity: 1; } 92%, 96% { opacity: 0; } }

  </style>
